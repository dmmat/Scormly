name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Дозволяємо лише один одночасний деплой.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # Tell IndexNow (Bing, and through it ChatGPT / Copilot search) that the
      # site changed. The key is public by design: it is served from the site
      # root as /eea20db262bcd580dfee3b0a2d56f2b4.txt. Never fails the deploy.
      - name: Notify IndexNow
        if: github.repository == 'dmmat/Scormly'
        continue-on-error: true
        run: |
          curl -sS --fail-with-body -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d '{"host":"scormly.app","key":"eea20db262bcd580dfee3b0a2d56f2b4","keyLocation":"https://scormly.app/eea20db262bcd580dfee3b0a2d56f2b4.txt","urlList":["https://scormly.app/","https://scormly.app/llms.txt"]}'
