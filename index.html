<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Free Open-Source SCORM Editor &amp; Authoring Tool | Scormly</title>
    <meta
      name="description"
      content="Free, open-source SCORM authoring tool in your browser. Build interactive courses and export SCORM 1.2, 2004 or cmi5. No sign-up, data stays local."
    />
    <meta name="theme-color" content="#ec4899" />
    <link rel="canonical" href="https://scormly.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Free Open-Source SCORM Editor &amp; Authoring Tool | Scormly" />
    <meta
      property="og:description"
      content="Free, open-source SCORM authoring tool in your browser. Build interactive courses and export SCORM 1.2, 2004 or cmi5. No sign-up, data stays local."
    />
    <meta property="og:site_name" content="Scormly" />
    <meta property="og:url" content="https://scormly.app/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="uk_UA" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:image" content="https://scormly.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Scormly — build interactive courses and export to SCORM" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Free Open-Source SCORM Editor &amp; Authoring Tool | Scormly" />
    <meta
      name="twitter:description"
      content="Free, open-source SCORM authoring tool in your browser. Build interactive courses and export SCORM 1.2, 2004 or cmi5. No sign-up, data stays local."
    />
    <meta name="twitter:image" content="https://scormly.app/og-image.png" />
    <meta name="twitter:image:alt" content="Scormly — build interactive courses and export to SCORM" />

    <!-- Misc -->
    <meta name="author" content="Dmytro Matsiuk" />
    <meta name="robots" content="index, follow" />
    <meta name="application-name" content="Scormly" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Installable web app (Chrome "Install app") -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Scormly" />

    <!-- The landing copy is prerendered into #root at build time (see
         scripts/seoPrerender.ts); with JS it stays hidden until React mounts. -->
    <script>
      document.documentElement.classList.add('js')
      if (/^\/(app|demo)(\/|$)/.test(location.pathname) || /^#\/(app|demo)/.test(location.hash)) document.documentElement.classList.add('route-app')
    </script>

    <!-- Structured data: helps search engines and AI assistants understand the project.
         %APP_VERSION% and %RELEASE_DATE% are filled in at build time (scripts/seoPrerender.ts). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Scormly",
        "alternateName": ["Scormly SCORM editor", "Scormly SCORM builder"],
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any modern web browser (Chrome, Edge, Firefox); saving to a folder needs Chrome or Edge",
        "url": "https://scormly.app/",
        "description": "Free, open-source SCORM editor and course builder (SCORM authoring tool) that runs online in the browser and exports SCORM 1.2 / 2004 and cmi5 (xAPI) packages for any LMS. No backend, no account — courses are kept in the browser, in a folder on disk or as a project .zip, and never leave the device.",
        "license": "https://opensource.org/licenses/MIT",
        "isAccessibleForFree": true,
        "inLanguage": ["en", "uk", "fr", "es"],
        "author": { "@type": "Person", "name": "Dmytro Matsiuk", "url": "https://github.com/dmmat" },
        "softwareVersion": "%APP_VERSION%",
        "dateModified": "%RELEASE_DATE%",
        "screenshot": "https://scormly.app/screenshot-builder.png",
        "installUrl": "https://scormly.app/app",
        "codeRepository": "https://github.com/dmmat/Scormly",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "featureList": [
          "Block-based course editor with drag-and-drop, undo/redo and insert-anywhere",
          "SCORM 1.2, SCORM 2004 (4th edition) and cmi5 (xAPI) export with resume, scores and question interactions",
          "Pre-export course check, including accessibility gaps",
          "Quizzes mixing single, multiple, matching, ordering and fill-in-the-blanks questions",
          "Branching dialogue scenarios with a chat layout, flashcards, image hotspots and reflection",
          "Process diagrams, step-by-step guides, timelines, comparison tables and before / after sliders",
          "Widget block: custom HTML / CSS / JavaScript or an uploaded page, styled to match the course",
          "Cover page, 10 themes and a custom theme, block backgrounds and ready-made block templates",
          "Review comments on blocks, shared through the project .zip, with no accounts",
          "Projects kept in the browser, in a folder on disk or as a project .zip",
          "AI-ready: AGENTS.md in every project documents the course format for AI assistants",
          "Accessible courses designed to help meet WCAG 2.1 AA: keyboard and screen-reader support, captions and transcripts, a learner accessibility menu",
          "Player interface in 8 languages; editor in English, Ukrainian, French and Spanish",
          "Guided tour, in-app Q&A and keyboard shortcuts",
          "Installable web app (PWA)",
          "Local-first: no backend, data stays on device"
        ]
      }
    </script>

    <!-- Organization + WebSite: helps Google associate the brand name and logo
         with the result, and links the site to its publisher. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://scormly.app/#organization",
            "name": "Scormly",
            "alternateName": ["Scornly"],
            "email": "hello@scormly.app",
            "url": "https://scormly.app/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://scormly.app/icon-512.png",
              "caption": "Scormly"
            },
            "image": "https://scormly.app/og-image.png",
            "founder": { "@type": "Person", "name": "Dmytro Matsiuk", "url": "https://github.com/dmmat" },
            "sameAs": ["https://github.com/dmmat/Scormly"]
          },
          {
            "@type": "WebSite",
            "@id": "https://scormly.app/#website",
            "name": "Scormly",
            "url": "https://scormly.app/",
            "description": "Free, open-source SCORM editor and course builder that works online in the browser.",
            "inLanguage": ["en", "uk", "fr", "es"],
            "publisher": { "@id": "https://scormly.app/#organization" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
